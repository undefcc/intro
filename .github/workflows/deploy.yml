name: Build Next.js and Deploy to Aliyun ECS

on:
  push:
    branches: [ main ] # 指定触发分支，可根据需要修改
  workflow_dispatch: # 允许在 Actions 页面手动重跑，旧运行过期后不必再推一次代码

env:
  # 定义全局环境变量，方便统一修改
  REGISTRY: crpi-zpvonb2nha7j0qgy.cn-shenzhen.personal.cr.aliyuncs.com  # 阿里云容器镜像服务（ACR）注册表地址:cite[2]:cite[5]
  IMAGE_NAMESPACE: cc4ever  # 在阿里云ACR中创建的命名空间:cite[5]
  APP_NAME: web-intro  # 应用名称

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      # 步骤1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 步骤2: 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # 与本地开发环境保持一致
          cache: 'npm'

      # 步骤3: 安装依赖并构建 Next.js (standalone 模式)
      # ✅ npm run build 现在会自动调用 post-build.js 复制静态文件
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
          # 验证静态文件已复制
          echo "✅ 验证构建产物..."
          ls -la .next/standalone/.next/static || echo "❌ 静态文件缺失"
          ls -la .next/standalone/public || echo "❌ public 目录缺失"

      # 步骤4: 准备 Docker 构建上下文
      # ✅ 简化：静态文件已由 post-build.js 自动复制到 standalone 目录
      - name: Prepare Docker context
        run: |
          # 创建存放构建产物的目录
          mkdir -p docker-build-context
          # 复制 standalone 模式生成的所有运行文件（已包含静态文件）
          shopt -s dotglob  # 启用隐藏文件匹配
          cp -r .next/standalone/* docker-build-context/
          shopt -u dotglob  # 关闭隐藏文件匹配
          # 复制自定义 server.js（如果需要覆盖）
          cp server.js docker-build-context/
          # 查看目录结构，用于调试
          echo "=== Docker build context structure ==="
          ls -la docker-build-context/
          echo "=== .next/static directory (应该已存在) ==="
          ls -la docker-build-context/.next/static/ 2>/dev/null || echo "❌ 静态文件缺失！"
          echo "=== public directory (应该已存在) ==="  
          ls -la docker-build-context/public/ 2>/dev/null || echo "❌ public 目录缺失！"
          echo "=== Socket.IO modules ==="
          ls -la docker-build-context/node_modules/socket.io/ 2>/dev/null || echo "No socket.io"

      # 步骤5: 登录阿里云 Docker Registry
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }} # 阿里云注册表用户名:cite[5]
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }} # 阿里云注册表密码:cite[5]

      # 步骤6: 构建并推送 Docker 镜像
      - name: Build and push Docker image
        id: push
        run: |
          # 使用 Git 提交的 SHA 作为镜像标签，确保唯一性
          tag="${GITHUB_SHA:0:8}"
          image="${REGISTRY}/${IMAGE_NAMESPACE}/${APP_NAME}:${tag}"
          latest="${REGISTRY}/${IMAGE_NAMESPACE}/${APP_NAME}:latest"
          docker build -t "$image" -f script/Dockerfile docker-build-context
          docker push "$image"
          docker tag "$image" "$latest"
          docker push "$latest"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  deploy-to-ecs:
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    environment: cc
    timeout-minutes: 20
    steps:
      - name: Deploy to Aliyun ECS via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE: ${{ needs.build-and-push-docker.outputs.image }}
          APP_NAME: ${{ env.APP_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
          ALIYUN_DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          ALIYUN_DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
          AI_302_API_KEY: ${{ secrets.AI_302_API_KEY }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.ECS_SSH_FINGERPRINT }}
          command_timeout: 15m
          version: "1.8.4"
          envs: IMAGE,APP_NAME,REGISTRY,ALIYUN_DOCKER_USERNAME,ALIYUN_DOCKER_PASSWORD,AI_302_API_KEY
          script: |
            set -eu
            test -n "$REGISTRY"
            test -n "$IMAGE"
            test -n "$APP_NAME"
            test -n "$ALIYUN_DOCKER_USERNAME"
            test -n "$ALIYUN_DOCKER_PASSWORD"
            test -n "$AI_302_API_KEY"
            printf '%s' "$ALIYUN_DOCKER_PASSWORD" | docker login --username "$ALIYUN_DOCKER_USERNAME" --password-stdin "$REGISTRY"
            docker pull "$IMAGE"
            docker stop "$APP_NAME" || true
            docker rm "$APP_NAME" || true
            docker run -d \
              -p 3000:3000 \
              -p 3001:3001 \
              --name "$APP_NAME" \
              -e NODE_ENV=production \
              -e AI_302_API_KEY="$AI_302_API_KEY" \
              --restart unless-stopped \
              "$IMAGE"
            docker network connect compose_default "$APP_NAME" || true
            status=$(docker inspect --format '{{.State.Status}}' "$APP_NAME")
            echo "$APP_NAME $status"
            test "$status" = "running"